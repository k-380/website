<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>海峡突破 — Battleship Strait</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#001008;color:#9dffc3;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;touch-action:none}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:12px;gap:8px}.panel{background:#00170ddd;border:1px solid #33d97888;border-radius:3px;padding:8px 11px;box-shadow:0 0 16px #00ff6640;font-size:13px}.bar{width:120px;height:6px;background:#0b3a20;border:1px solid #36b66b66;overflow:hidden;margin-top:5px}.fill{height:100%;background:#62ff9c;transition:width .15s}.controls{pointer-events:auto;position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 104px 1fr;align-items:end;padding:0 18px;gap:13px}.turn,.engine{border:1px solid #37c971;background:#052817e8;color:#aaffc8;box-shadow:0 0 14px #00ff5533;border-radius:4px;font-weight:800;user-select:none;-webkit-user-select:none}.turn{height:78px;font-size:28px}.engine{height:48px;font-size:16px}.mid{display:grid;gap:9px}.turn:active,.engine:active,.held{background:#0d6838!important;transform:translateY(2px)}.ciws{border-color:#e7d35b;color:#fff3a0;background:#3a3309e8}.engine:disabled{opacity:.42;filter:saturate(.35);transform:none!important}
#message{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#031019b8;pointer-events:auto}.card{text-align:center;width:min(88vw,440px);background:#0b2029;border:1px solid #62828c;border-radius:14px;padding:25px;box-shadow:0 14px 50px #000}.card h1{margin:0 0 10px;font-size:28px;letter-spacing:.12em}.card p{line-height:1.65;color:#b9cdd3}.card button{margin-top:10px;padding:13px 28px;border:0;border-radius:99px;background:#d2b35b;color:#172027;font-weight:900;font-size:17px}.hint{position:absolute;top:82px;width:100%;text-align:center;color:#bed0d5;font-size:12px;text-shadow:0 2px 4px #000}
</style></head>
<body><canvas id="game"></canvas><div id="hud">
 <div class="top"><div class="panel">速力 <b id="speed">0.0</b> kt<br>推進 <b id="power">5</b>/10<br>方位 <b id="heading">000</b>°<br>CIWS <b id="ciwsStatus">5 READY</b></div><div class="panel">残距離 <b id="distance">--</b> m<div class="bar"><div class="fill" id="progress"></div></div></div><div class="panel">船体 <b id="hull">100</b>%<div class="bar"><div class="fill" id="hullbar"></div></div></div></div>
 <div class="hint">左右で転舵　狭水道では減速せよ</div>
 <div class="controls"><button class="turn" id="left">◀</button><div class="mid"><button class="engine" id="faster">推進＋</button><button class="engine ciws" id="ciws">CIWS ×5</button><button class="engine" id="slower">推進－</button></div><button class="turn" id="right">▶</button></div>
 <div id="message"><div class="card"><h1>海峡突破</h1><p>敵船は常時表示され、発射時には橙色に発光します。<br>発射された魚雷は走査線が通過するまで表示されません。<br>触雷は即撃沈、魚雷命中は船体へ大損害となります。</p><button id="start">出航する</button></div></div>
</div><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let W,H,dpr;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const keys={left:false,right:false};let running=false,last=0,ship,radarAngle=-Math.PI/2,torpedoes=[],torpedoTimer=5,shipTrail=[],shipTrailClock=0;
// Centerline: procedurally blended bends; width pinches form three narrow straits.
function centerX(y){return 155*Math.sin(y/720)+85*Math.sin(y/295+1.1)+45*Math.sin(y/1450)}
function channelWidth(y){let w=370;for(const p of [1250,2750,4200]){let d=(y-p)/310;w-=230*Math.exp(-d*d)}return w}
const endY=5200;
const mines=[420,690,930,1190,1510,1790,2070,2390,2690,3010,3290,3560,3890,4180,4490,4780].map((y,i)=>({y,x:centerX(y)+Math.sin(i*2.17+.6)*channelWidth(y)*.32,lastSeen:-99}));
const enemies=[330,760,1210,1660,2110,2570,3030,3490,3950,4420,4890].map((y,i)=>({y,x:centerX(y)+(i%2?1:-1)*channelWidth(y)*.36,flash:0}));
function reset(){ship={x:centerX(0),y:60,angle:0,speed:29,target:29,power:5,vx:0,vy:29*1.72,yawRate:0,hull:100,hit:0,time:0,ciwsAmmo:5,ciwsCooldown:0,ciwsPulse:0};radarAngle=-Math.PI/2;torpedoes=[];shipTrail=[];shipTrailClock=0;torpedoTimer=3.5+Math.random()*3;mines.forEach(m=>m.lastSeen=-99);enemies.forEach(e=>e.flash=0);running=true;last=performance.now();document.querySelector('#message').style.display='none';requestAnimationFrame(loop)}
function bindHold(id,key){const b=document.querySelector(id);for(const ev of ['pointerdown'])b.addEventListener(ev,e=>{e.preventDefault();keys[key]=true;b.classList.add('held');b.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{keys[key]=false;b.classList.remove('held')})}
bindHold('#left','left');bindHold('#right','right');
function changePower(delta){if(!ship)return;ship.power=Math.max(1,Math.min(10,ship.power+delta));ship.target=4+ship.power*5}
function fireCIWS(){if(!running||ship.ciwsAmmo<=0||ship.ciwsCooldown>0)return;ship.ciwsAmmo--;ship.ciwsCooldown=10;ship.ciwsPulse=.42;torpedoes=torpedoes.filter(q=>Math.hypot(q.x-ship.x,q.y-ship.y)>150);updateHud()}
document.querySelector('#faster').onclick=()=>changePower(1);document.querySelector('#slower').onclick=()=>changePower(-1);document.querySelector('#ciws').onclick=fireCIWS;document.querySelector('#start').onclick=reset;
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key==='ArrowUp')changePower(1);if(e.key==='ArrowDown')changePower(-1);if(e.code==='Space'){e.preventDefault();fireCIWS()}});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false});
function loop(t){if(!running)return;let dt=Math.min((t-last)/1000,.04);last=t;update(dt);draw();if(running)requestAnimationFrame(loop)}
function update(dt){ship.time+=dt;radarAngle=(radarAngle+dt*2.35)%(Math.PI*2);enemies.forEach(e=>e.flash=Math.max(0,e.flash-dt));ship.ciwsCooldown=Math.max(0,ship.ciwsCooldown-dt);ship.ciwsPulse=Math.max(0,ship.ciwsPulse-dt);
 // Heavy hull: engine speed, yaw rate and travel direction all change gradually.
 ship.speed+=(ship.target-ship.speed)*dt*.48;
 let turn=(keys.right?1:0)-(keys.left?1:0),maxYaw=Math.max(.18,.46-.0045*ship.speed);
 if(turn)ship.yawRate+=turn*.48*dt;else ship.yawRate*=Math.exp(-1.65*dt);
 ship.yawRate=Math.max(-maxYaw,Math.min(maxYaw,ship.yawRate));
 ship.angle+=ship.yawRate*dt;ship.angle=Math.atan2(Math.sin(ship.angle),Math.cos(ship.angle));
 // Propulsion pulls the velocity toward the bow, but existing momentum remains.
 let v=ship.speed*1.72,wantVx=Math.sin(ship.angle)*v,wantVy=Math.cos(ship.angle)*v,response=.46;
 ship.vx+=(wantVx-ship.vx)*response*dt;ship.vy+=(wantVy-ship.vy)*response*dt;
 ship.x+=ship.vx*dt;ship.y+=ship.vy*dt;
 shipTrailClock-=dt;if(shipTrailClock<=0){shipTrail.push({x:ship.x,y:ship.y});if(shipTrail.length>46)shipTrail.shift();shipTrailClock=.09}
 for(const m of mines)if(Math.hypot(ship.x-m.x,ship.y-m.y)<25){finish(false,'触雷・撃沈','機雷に接触しました。戦艦は直ちに沈没しました。');return}
 torpedoTimer-=dt;if(torpedoTimer<=0)torpedoTimer=launchTorpedo()?4.5+Math.random()*5:1;
 for(let i=torpedoes.length-1;i>=0;i--){let q=torpedoes[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;if(q.lastSeen>-50){q.trail.push({x:q.x,y:q.y});if(q.trail.length>28)q.trail.shift()}if(Math.hypot(ship.x-q.x,ship.y-q.y)<24){ship.hull-=65;ship.hit=.5;torpedoes.splice(i,1);if(ship.hull<=0){finish(false,'魚雷命中・撃沈','魚雷の直撃により船体が崩壊しました。');return}}else if(q.life<=0)torpedoes.splice(i,1)}
 let dx=Math.abs(ship.x-centerX(ship.y)),safe=channelWidth(ship.y)/2-20;if(dx>safe){let impact=(dx-safe);ship.hull-=dt*(8+impact*.3+ship.speed*.18);let brake=Math.pow(.3,dt);ship.speed*=brake;ship.vx*=brake;ship.vy*=brake;ship.yawRate*=Math.pow(.45,dt);ship.hit=.18}ship.hit=Math.max(0,ship.hit-dt);
 if(ship.hull<=0)finish(false,'座礁・航行不能','船体を損傷し、海峡突破に失敗しました。');else if(ship.y>=endY)finish(true,'海峡突破','湾口へ到達しました。所要時間 '+ship.time.toFixed(1)+' 秒');updateHud()}
function launchTorpedo(){let candidates=enemies.filter(e=>{let p=worldToScreen(e.x,e.y);return p.x>18&&p.x<W-18&&p.y>75&&p.y<H-100});if(!candidates.length)return false;let e=candidates[Math.floor(Math.random()*candidates.length)],dx=ship.x-e.x,dy=ship.y-e.y,d=Math.hypot(dx,dy),speed=82;e.flash=.8;torpedoes.push({x:e.x,y:e.y,vx:dx/d*speed,vy:dy/d*speed,life:12,lastSeen:-99,trail:[]});return true}
function finish(ok,title,text){running=false;let m=document.querySelector('#message');m.style.display='flex';m.querySelector('.card').innerHTML=`<h1>${title}</h1><p>${text}</p><button onclick="reset()">再出航</button>`}
function updateHud(){document.querySelector('#speed').textContent=(Math.hypot(ship.vx,ship.vy)/1.72).toFixed(1);document.querySelector('#power').textContent=ship.power;document.querySelector('#heading').textContent=String(Math.round((ship.angle*180/Math.PI+360)%360)).padStart(3,'0');let cb=document.querySelector('#ciws');if(ship.ciwsAmmo<=0){cb.textContent='CIWS EMPTY';cb.disabled=true}else if(ship.ciwsCooldown>0){cb.textContent='装填 '+ship.ciwsCooldown.toFixed(1)+'s';cb.disabled=true}else{cb.textContent='CIWS ×'+ship.ciwsAmmo;cb.disabled=false}document.querySelector('#ciwsStatus').textContent=ship.ciwsAmmo+' '+(ship.ciwsCooldown>0?ship.ciwsCooldown.toFixed(1)+'s':'READY');document.querySelector('#distance').textContent=Math.max(0,Math.round(endY-ship.y));document.querySelector('#progress').style.width=Math.min(100,ship.y/endY*100)+'%';document.querySelector('#hull').textContent=Math.max(0,Math.round(ship.hull));let hb=document.querySelector('#hullbar');hb.style.width=Math.max(0,ship.hull)+'%';hb.style.background=ship.hull<35?'#e76152':'#6bd4ae'}
function worldToScreen(x,y){let dx=x-ship.x,dy=y-ship.y,a=ship.angle,c=Math.cos(a),s=Math.sin(a);return{x:W/2+dx*c-dy*s,y:H*.54-(dx*s+dy*c)}}
function draw(){ctx.fillStyle=ship.hit?'#201006':'#001008';ctx.fillRect(0,0,W,H);drawRadarGrid();let step=35,start=ship.y-H*.9,end=ship.y+H*1.45;drawBank(start,end,step,-1);drawBank(start,end,step,1);
 // channel center marks and distance gates
 ctx.setLineDash([3,15]);ctx.strokeStyle='#8dc2c822';ctx.lineWidth=1;ctx.beginPath();for(let y=start,i=0;y<end;y+=step,i++){let p=worldToScreen(centerX(y),y);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}ctx.stroke();ctx.setLineDash([]);
 for(let y=Math.ceil(start/500)*500;y<end;y+=500){if(y<0||y>endY)continue;let p=worldToScreen(centerX(y),y);ctx.fillStyle='#a8c5ca99';ctx.font='11px system-ui';ctx.fillText(Math.max(0,endY-y)+' m',p.x+8,p.y)}
 drawMines();drawEnemies();drawTorpedoes();drawShipTrail();drawRadarSweep();drawCIWS();drawShip();drawHeadUp();let g=worldToScreen(centerX(endY),endY);if(g.y>-100&&g.y<H+100){ctx.strokeStyle='#8affaf';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(g.x-90,g.y);ctx.lineTo(g.x+90,g.y);ctx.stroke();ctx.fillStyle='#b6ffca';ctx.textAlign='center';ctx.fillText('湾口・GOAL',g.x,g.y-10);ctx.textAlign='left'}}
function drawBank(start,end,step,side){
 // Close the land polygon in world space, not against fixed screen corners.
 // This keeps the polygon simple even while the whole map rotates.
 let shore=[],outer=[],far=2600;
 for(let y=start;y<=end;y+=step){
  shore.push(worldToScreen(centerX(y)+side*channelWidth(y)/2,y));
  outer.push(worldToScreen(centerX(y)+side*(channelWidth(y)/2+far),y));
 }
 ctx.beginPath();shore.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
 for(let i=outer.length-1;i>=0;i--)ctx.lineTo(outer[i].x,outer[i].y);
 ctx.closePath();ctx.fillStyle='#042315';ctx.fill();
 ctx.strokeStyle='#3cff8b22';ctx.lineWidth=8;ctx.beginPath();shore.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();
 ctx.strokeStyle='#52ff91';ctx.lineWidth=2;ctx.stroke();
}
function drawRadarGrid(){let x=W/2,y=H*.54,r=Math.max(W,H)*.72;ctx.save();ctx.strokeStyle='#35d97722';ctx.lineWidth=1;for(let q=1;q<=4;q++){ctx.beginPath();ctx.arc(x,y,r*q/4,0,Math.PI*2);ctx.stroke()}ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();ctx.restore()}
function scanned(p){let a=Math.atan2(p.y-H*.54,p.x-W/2),d=Math.atan2(Math.sin(a-radarAngle),Math.cos(a-radarAngle));return Math.abs(d)<.065}
function echoAlpha(lastSeen){let age=ship.time-lastSeen;if(age<0||age>2.55)return 0;return Math.max(.06,1-age/2.45)}
function drawMines(){for(const m of mines){let p=worldToScreen(m.x,m.y);if(p.x<-30||p.x>W+30||p.y<-30||p.y>H+30)continue;if(scanned(p))m.lastSeen=ship.time;let alpha=echoAlpha(m.lastSeen);if(!alpha)continue;ctx.save();ctx.globalAlpha=alpha;ctx.translate(p.x,p.y);ctx.shadowColor='#9dffb9';ctx.shadowBlur=12*alpha;ctx.strokeStyle='#adffc4';ctx.fillStyle='#66ff9933';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,8,0,Math.PI*2);ctx.fill();ctx.stroke();for(let i=0;i<8;i++){let a=i*Math.PI/4;ctx.beginPath();ctx.moveTo(Math.cos(a)*8,Math.sin(a)*8);ctx.lineTo(Math.cos(a)*12,Math.sin(a)*12);ctx.stroke()}ctx.restore()}}
function drawEnemies(){for(const e of enemies){let p=worldToScreen(e.x,e.y);if(p.x<-40||p.x>W+40||p.y<-40||p.y>H+40)continue;ctx.save();ctx.translate(p.x,p.y);let f=e.flash/.8;if(f>0){ctx.fillStyle=`rgba(255,142,55,${.2+.55*f})`;ctx.shadowColor='#ff7b28';ctx.shadowBlur=28*f;ctx.beginPath();ctx.arc(0,0,15+18*(1-f),0,Math.PI*2);ctx.fill()}ctx.strokeStyle=f>0?'#fff0a6':'#ff8354';ctx.fillStyle='#7d261c';ctx.lineWidth=2;ctx.shadowColor=f>0?'#ff9a42':'#ff542c';ctx.shadowBlur=f>0?18:6;ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(8,11);ctx.lineTo(0,7);ctx.lineTo(-8,11);ctx.closePath();ctx.fill();ctx.stroke();ctx.font='9px ui-monospace';ctx.textAlign='center';ctx.fillStyle='#ff9a77';ctx.fillText('ENEMY',0,25);ctx.restore()}}
function drawTorpedoes(){for(const q of torpedoes){let p=worldToScreen(q.x,q.y);if(p.x<-40||p.x>W+40||p.y<-40||p.y>H+40)continue;if(scanned(p))q.lastSeen=ship.time;let alpha=echoAlpha(q.lastSeen);if(!alpha)continue;ctx.save();for(let i=1;i<q.trail.length;i++){let a=worldToScreen(q.trail[i-1].x,q.trail[i-1].y),b=worldToScreen(q.trail[i].x,q.trail[i].y);ctx.globalAlpha=alpha*i/q.trail.length*.7;ctx.strokeStyle='#ffe96e';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}ctx.globalAlpha=alpha;ctx.translate(p.x,p.y);ctx.fillStyle='#fff59b';ctx.shadowColor='#ffeb61';ctx.shadowBlur=12*alpha;ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fill();ctx.restore()}}
function drawShipTrail(){if(shipTrail.length<2)return;ctx.save();for(let i=1;i<shipTrail.length;i++){let a=worldToScreen(shipTrail[i-1].x,shipTrail[i-1].y),b=worldToScreen(shipTrail[i].x,shipTrail[i].y);ctx.globalAlpha=.03+.34*i/shipTrail.length;ctx.strokeStyle='#6dff9e';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}ctx.restore()}
function drawCIWS(){if(ship.ciwsPulse<=0)return;let p=1-ship.ciwsPulse/.42,r=20+p*130;ctx.save();ctx.globalAlpha=1-p;ctx.strokeStyle='#fff16f';ctx.shadowColor='#fff16f';ctx.shadowBlur=18;ctx.lineWidth=3;ctx.beginPath();ctx.arc(W/2,H*.54,r,0,Math.PI*2);ctx.stroke();ctx.restore()}
function drawRadarSweep(){let x=W/2,y=H*.54,r=Math.max(W,H)*1.05;ctx.save();let grad=ctx.createRadialGradient(x,y,0,x,y,r);grad.addColorStop(0,'#55ff9930');grad.addColorStop(1,'#55ff9900');ctx.fillStyle=grad;ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,r,radarAngle-.38,radarAngle);ctx.closePath();ctx.fill();ctx.strokeStyle='#8dffb9bb';ctx.shadowColor='#5cff93';ctx.shadowBlur=9;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(radarAngle)*r,y+Math.sin(radarAngle)*r);ctx.stroke();ctx.restore()}
function drawShip(){let x=W/2,y=H*.54;ctx.save();ctx.translate(x,y);ctx.shadowColor='#69ff9a';ctx.shadowBlur=12;ctx.fillStyle='#8affad';ctx.beginPath();ctx.moveTo(0,-23);ctx.lineTo(11,16);ctx.lineTo(0,10);ctx.lineTo(-11,16);ctx.closePath();ctx.fill();ctx.restore()}
function drawHeadUp(){let x=W/2,y=H*.54;ctx.save();ctx.strokeStyle='#84e6dc88';ctx.fillStyle='#a8fff7aa';ctx.lineWidth=1;ctx.setLineDash([5,7]);ctx.beginPath();ctx.moveTo(x,y-145);ctx.lineTo(x,y-55);ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.arc(x,y,78,-2.85,-2.25);ctx.stroke();ctx.beginPath();ctx.arc(x,y,78,-.89,-.29);ctx.stroke();ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText('HEAD UP',x,y-154);ctx.restore()}
// Show the complete fixed chart and the ship's departure position before launch.
ship={x:centerX(0),y:60,angle:0,speed:0,target:29,power:5,vx:0,vy:0,yawRate:0,hull:100,hit:0,time:0,ciwsAmmo:5,ciwsCooldown:0,ciwsPulse:0};
draw();
</script></body></html>
