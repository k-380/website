const suits = ["m","p"];

========================= */
function buildWall() {
  const w = [];
  for (let s of suits) for (let n of numbers) for (let i=0;i<4;i++) w.push(`${n}${s}`);
  shuffle(w);
  return w;
}

function shuffle(array) {
  for (let i=array.length-1;i>0;i--) {
    const j = Math.floor(Math.random()*(i+1));
    [array[i],array[j]]=[array[j],array[i]];
  }
}

function tileSortKey(t){
  // mを先、pを後、数字順
  const n = parseInt(t,10);
  const s = t[1];
  const suitRank = (s==="m") ? 0 : 1;
  return suitRank*100 + n;
}

function countTiles(arr){
  const c = {};
  for (const t of arr) c[t]=(c[t]||0)+1;
  return c;
}

function removeTiles(arr,tile,count){
  for(let i=0;i<count;i++){
    const idx = arr.indexOf(tile);
    if (idx>=0) arr.splice(idx,1);
  }
}
