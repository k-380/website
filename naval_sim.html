<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>艦長視点・海戦シミュレータ</title><style>body{margin:0;background:#08110e;color:#dce9e3;font-family:system-ui,sans-serif}main{max-width:760px;margin:auto;padding:12px}.panel{background:#0d1915;border:1px solid #29473d;border-radius:14px;padding:12px;margin-bottom:10px}#radar{display:block;width:100%;background:#07120f;border-radius:10px;touch-action:manipulation}.top,.sub{display:flex;justify-content:space-between;gap:8px;align-items:center}.top{margin-bottom:8px}.sub{font-size:12px;color:#9db1a8;margin-top:7px}.helm{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}button{min-height:58px;border-radius:12px;border:1px solid #52675e;background:#15231d;color:#eef7f3;font-size:18px;font-weight:700}button:active{background:#263b32}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:13px}.stats div{min-width:0}.stats strong{display:block;font-size:15px;margin-top:2px}.trail{stroke:#d6ddd9;stroke-width:1.4;stroke-dasharray:5 6;opacity:.65;fill:none}.dot{fill:#fff;stroke:#777}.aim{stroke:#fff;stroke-width:2;fill:none;opacity:.9}.screen-flash{pointer-events:none;opacity:0}.screen-flash.miss{animation:missflash .34s ease-out}@keyframes missflash{0%{opacity:.68}100%{opacity:0}}.kill-ring{fill:#ff2020;stroke:#fff;stroke-width:2;animation:killflash .48s ease-out forwards;transform-box:fill-box;transform-origin:center}@keyframes killflash{0%{opacity:1;transform:scale(.7)}35%{opacity:1;transform:scale(2.3)}100%{opacity:0;transform:scale(3.3)}@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}} </style></head><body><main><section class="panel"><div class="top"><strong>戦闘指揮所 / PURSUIT</strong><span id="status">戦闘開始</span></div><svg id="radar" viewBox="0 0 600 600"><rect width="600" height="600" fill="#07120f"/><g stroke="#29473d" fill="none"><circle cx="300" cy="300" r="75"/><circle cx="300" cy="300" r="150"/><circle cx="300" cy="300" r="225"/><circle cx="300" cy="300" r="285"/><line x1="300" y1="15" x2="300" y2="585"/><line x1="15" y1="300" x2="585" y2="300"/></g><circle id="rangeRing" cx="300" cy="300" r="285" fill="none" stroke="#c8d8d0" stroke-width="2" stroke-dasharray="8 7" opacity=".75"/><text id="centerTimer" x="300" y="325" text-anchor="middle" font-family="monospace" font-size="86" font-weight="700" fill="#d7e7df" opacity=".13">30.0</text><g font-family="monospace"><rect x="20" y="20" width="185" height="58" rx="5" fill="#0b1c17" stroke="#42685a"/><text x="32" y="43" fill="#759a8c" font-size="12">WIND</text><text id="radarWind" x="32" y="65" fill="#d7e7df" font-size="17">000° 0.0 m/s</text><g id="windArrow" transform="translate(178 49)"><line x1="0" y1="17" x2="0" y2="-15" stroke="#d7e7df" stroke-width="2"/><path d="M0 -18 L-5 -9 L5 -9 Z" fill="#d7e7df"/></g></g><g id="trailLayer"></g><g id="aimLayer"></g><g id="ghostLayer"></g><g id="contactLayer"></g><g id="effectLayer"></g><g id="shellLayer"></g><g transform="translate(300 300)"><circle r="8" fill="#eee"/><path d="M0 -25 L-8 5 L8 5 Z" fill="#eee"/></g><rect id="missFlash" class="screen-flash" width="600" height="600" fill="#fff"/></svg><div class="helm"><button id="left">↶ 左舷</button><button id="right">右舷 ↷</button></div><div class="sub"><span>長押しで連続操舵</span><span>舵角 <strong id="rudder">中央</strong></span></div></section><section class="panel stats"><div>撃沈<strong id="kills">0</strong></div><div>敵距離<strong id="distance">---</strong></div><div>射程<strong id="gunRange">18 km</strong></div><div>針路<strong id="heading">000°</strong></div><div>敵速<strong id="enemySpeed">---</strong></div><div>自艦<strong>24.0 kt</strong></div><div>ミス<strong id="misses">0 / 3</strong></div><div>装填<strong id="reload">READY</strong></div></section><button id="restart" style="width:100%">再出撃</button></main><script>
const $=s=>document.querySelector(s),svg=$('#radar'),contacts=$('#contactLayer'),ghostLayer=$('#ghostLayer'),shellLayer=$('#shellLayer'),trailLayer=$('#trailLayer'),aimLayer=$('#aimLayer'),effectLayer=$('#effectLayer'),missFlash=$('#missFlash'),NS='http://www.w3.org/2000/svg';const SCALE=285/18,HIT_RADIUS=1.65,OWN_SPEED=.667,MAX_RADAR=17.2,rnd=(a,b)=>a+Math.random()*(b-a);let enemy,shells,kills,misses,reloadUntil,last,lastKill,running,windX,windY,targetWX,targetWY,nextWind,heading,ownX,ownY,helmInput=0,rudder=0,yawRate=0,aims=[],ghosts=[],lastGhost=0;function rot(x,y,a){let c=Math.cos(a),s=Math.sin(a);return{x:x*c-y*s,y:x*s+y*c}}function screen(wx,wy){let p=rot(wx-ownX,wy-ownY,-heading);return{x:300+p.x*SCALE,y:300-p.y*SCALE}}function worldFromScreen(x,y){let p=rot((x-300)/SCALE,-(y-300)/SCALE,heading);return{x:ownX+p.x,y:ownY+p.y}}function gunRange(){return 18-Math.floor((kills%50)/10)*2}function speedMultiplier(){return Math.min(3.2,1+kills*.10)}function visualScale(){return Math.max(.38,1-Math.min(kills,22)*.028)}function setMotion(e,now,first){let old=Math.atan2(e.vx||0,e.vy||1),a=first?rnd(0,Math.PI*2):old+rnd(-.55,.55),s=rnd(.25,.8)*speedMultiplier();e.tvx=Math.sin(a)*s;e.tvy=Math.cos(a)*s;if(first){e.vx=e.tvx;e.vy=e.tvy}e.next=now+rnd(2500,6500)}function spawn(now,msg=true){ghosts=[];lastGhost=now;let a=rnd(0,Math.PI*2),r=rnd(8,16);enemy={x:ownX+Math.sin(a)*r,y:ownY+Math.cos(a)*r,alive:true,vx:0,vy:0};setMotion(enemy,now,true);if(msg)$('#status').textContent='新たな敵艦を捕捉。'}function newWind(now){let a=rnd(0,Math.PI*2),s=rnd(2,18);targetWX=Math.sin(a)*s;targetWY=Math.cos(a)*s;nextWind=now+rnd(1800,5300)}function updateWind(dt,now){if(now>nextWind)newWind(now);let k=1-Math.exp(-dt*.65);windX+=(targetWX-windX)*k;windY+=(targetWY-windY)*k;let s=Math.hypot(windX,windY),abs=(Math.atan2(windX,windY)*180/Math.PI+360)%360,rel=(abs-heading*180/Math.PI+360)%360;$('#radarWind').textContent=String(Math.round(abs)).padStart(3,'0')+'° '+s.toFixed(1)+' m/s';$('#windArrow').setAttribute('transform','translate(178 49) rotate('+rel+')')}function updateShip(dt){let target=helmInput,rate=helmInput?.55:.32,step=rate*dt;if(rudder<target)rudder=Math.min(target,rudder+step);else if(rudder>target)rudder=Math.max(target,rudder-step);let desired=rudder*.38,k=1-Math.exp(-dt*1.15);yawRate+=(desired-yawRate)*k;heading=(heading+yawRate*dt+Math.PI*2)%(Math.PI*2);ownX+=Math.sin(heading)*OWN_SPEED*dt;ownY+=Math.cos(heading)*OWN_SPEED*dt}function ui(){$('#kills').textContent=kills;$('#misses').textContent=misses+' / 3';$('#gunRange').textContent=gunRange()+' km';$('#rangeRing').setAttribute('r',gunRange()*SCALE);$('#heading').textContent=String(Math.round(heading*180/Math.PI)%360).padStart(3,'0')+'°';let rd=Math.round(Math.abs(rudder)*35);$('#rudder').textContent=rd<1?'中央':(rudder<0?'左 '+rd+'°':'右 '+rd+'°');if(enemy){$('#enemySpeed').textContent=(Math.hypot(enemy.vx,enemy.vy)*36).toFixed(1)+' kt';$('#distance').textContent=Math.hypot(enemy.x-ownX,enemy.y-ownY).toFixed(1)+' km'}}function gameOver(r){running=false;shells=[];helmInput=0;$('#status').textContent='GAME OVER — '+r;$('#centerTimer').textContent='0.0'}function reset(){let now=performance.now();shells=[];aims=[];ghosts=[];effectLayer.innerHTML='';kills=misses=0;heading=ownX=ownY=helmInput=rudder=yawRate=0;reloadUntil=0;last=lastKill=now;running=true;windX=3;windY=1;newWind(now);spawn(now);ui()}function addAim(wx,wy,now){aims.push({x:wx,y:wy,end:now+1400});if(aims.length>6)aims.shift()}function flashMiss(){missFlash.classList.remove('miss');void missFlash.getBoundingClientRect();missFlash.classList.add('miss')}function flashEnemy(wx,wy){let p=screen(wx,wy),c=document.createElementNS(NS,'circle');c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r','11');c.setAttribute('class','kill-ring');effectLayer.appendChild(c);setTimeout(()=>{if(c.parentNode)c.remove()},520)}function fire(wx,wy,now){if(!running||now<reloadUntil)return;addAim(wx,wy,now);let dx=wx-ownX,dy=wy-ownY,r=Math.hypot(dx,dy);if(r>gunRange()){$('#status').textContent='射程外 — 追跡せよ';return}reloadUntil=now+900;let flight=.65+r*.105;shells.push({x:ownX,y:ownY,vx:dx/flight,vy:dy/flight,end:now+flight*1000,path:[]});$('#status').textContent='主砲発射！'}svg.addEventListener('pointerdown',e=>{let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;let q=p.matrixTransform(svg.getScreenCTM().inverse()),w=worldFromScreen(q.x,q.y);fire(w.x,w.y,performance.now())});function bind(el,val){el.addEventListener('pointerdown',e=>{e.preventDefault();helmInput=val;el.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(t=>el.addEventListener(t,()=>helmInput=0))}bind($('#left'),-1);bind($('#right'),1);$('#restart').onclick=reset;function impact(s,now){let hit=enemy&&enemy.alive&&Math.hypot(enemy.x-s.x,enemy.y-s.y)<HIT_RADIUS;if(hit){let hx=enemy.x,hy=enemy.y;flashEnemy(hx,hy);enemy.alive=false;kills++;misses=0;lastKill=now;spawn(now,false);$('#status').textContent=kills%50===0?'50隻突破！ 射程18 kmへ回復！':'直撃！ 敵艦撃沈！'}else{misses++;flashMiss();$('#status').textContent='水柱。連続ミス '+misses+'/3';if(misses>=3)gameOver('3発連続ミス')}ui()}function keepEnemy(now){let dx=enemy.x-ownX,dy=enemy.y-ownY,d=Math.hypot(dx,dy);if(d>MAX_RADAR){let ux=dx/d,uy=dy/d;enemy.x=ownX+ux*MAX_RADAR;enemy.y=ownY+uy*MAX_RADAR;let a=Math.atan2(-ux,-uy)+rnd(-.45,.45),s=Math.hypot(enemy.vx,enemy.vy);enemy.vx=enemy.tvx=Math.sin(a)*s;enemy.vy=enemy.tvy=Math.cos(a)*s;enemy.next=now+rnd(1800,4000)}}function renderAims(now){aimLayer.innerHTML='';aims=aims.filter(a=>a.end>now);for(const a of aims){let p=screen(a.x,a.y),g=document.createElementNS(NS,'g');g.setAttribute('class','aim');let c=document.createElementNS(NS,'circle');c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r',10);g.appendChild(c);for(const d of [[-17,0,-7,0],[7,0,17,0],[0,-17,0,-7],[0,7,0,17]]){let l=document.createElementNS(NS,'line');l.setAttribute('x1',p.x+d[0]);l.setAttribute('y1',p.y+d[1]);l.setAttribute('x2',p.x+d[2]);l.setAttribute('y2',p.y+d[3]);g.appendChild(l)}aimLayer.appendChild(g)}}function renderGhosts(now){ghostLayer.innerHTML='';ghosts=ghosts.filter(g=>now-g.t<1900);for(const g of ghosts){let age=(now-g.t)/1900,p=screen(g.x,g.y),c=document.createElementNS(NS,'circle');c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r',Math.max(2.2,g.r*(1-age*.35)));c.setAttribute('fill','#8ab5a5');c.setAttribute('opacity',Math.max(0,.34*(1-age)));ghostLayer.appendChild(c)}}function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;updateWind(dt,now);if(running){updateShip(dt);let rem=Math.max(0,30-(now-lastKill)/1000);$('#centerTimer').textContent=rem.toFixed(1);$('#centerTimer').setAttribute('opacity',rem<10?'.24':'.13');if(rem<=0)gameOver('30秒間撃沈なし');if(enemy&&enemy.alive){if(now>enemy.next)setMotion(enemy,now,false);let k=1-Math.exp(-dt*.7);enemy.vx+=(enemy.tvx-enemy.vx)*k;enemy.vy+=(enemy.tvy-enemy.vy)*k;enemy.x+=enemy.vx*dt;enemy.y+=enemy.vy*dt;keepEnemy(now);if(now-lastGhost>135){ghosts.push({x:enemy.x,y:enemy.y,t:now,r:Math.max(3.4,9*visualScale())});if(ghosts.length>18)ghosts.shift();lastGhost=now}}}ui();renderAims(now);renderGhosts(now);contacts.innerHTML='';if(enemy&&enemy.alive){let p=screen(enemy.x,enemy.y),c=document.createElementNS(NS,'circle');c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r',Math.max(3.4,9*visualScale()));c.setAttribute('fill','#a8d3c3');contacts.appendChild(c)}shellLayer.innerHTML='';trailLayer.innerHTML='';if(running)for(let i=shells.length-1;i>=0;i--){let s=shells[i];if(now<s.end){s.vx+=windX*.0016*dt;s.vy+=windY*.0016*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.path.push({x:s.x,y:s.y});if(s.path.length>100)s.path.shift()}if(s.path.length>1){let pl=document.createElementNS(NS,'polyline');pl.setAttribute('points',s.path.map(q=>{let p=screen(q.x,q.y);return p.x+','+p.y}).join(' '));pl.setAttribute('class','trail');trailLayer.appendChild(pl)}let p=screen(s.x,s.y),d=document.createElementNS(NS,'circle');d.setAttribute('cx',p.x);d.setAttribute('cy',p.y);d.setAttribute('r',5);d.setAttribute('class','dot');shellLayer.appendChild(d);if(now>=s.end){impact(s,now);shells.splice(i,1);if(!running)break}}$('#reload').textContent=running?(now>=reloadUntil?'READY':((reloadUntil-now)/1000).toFixed(1)+' s'):'---';requestAnimationFrame(frame)}reset();requestAnimationFrame(frame);
</script></body></html>
