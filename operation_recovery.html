<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<style>

</style></head>
<body><div id="wrap">
<header><h1>OPERATION RECOVERY</h1><div class="status"><span id="modeStatus">MODE --</span><span id="phase">PHASE 1 / INFILTRATE</span><span id="strength">戦力 100%</span><span id="clock">00:00</span></div></header>
<div id="stage"><canvas id="c"></canvas>
<div id="brief">任務：北東の敵拠点へ進軍し、重要人物を奪還せよ。<br>地図をタップ：部隊移動　射撃：自動<br>戦車は通常射撃無効。支援火力で排除せよ。</div><div id="message"></div>
<div id="start"><div class="panel"><h2>SELECT MODE</h2><p>作戦開始前にモードを選択してください。選択後は変更できません。</p><div class="modes"><button onclick="chooseGameMode('normal')"><b>通常モード</b>固定マップで作戦開始</button><button onclick="chooseGameMode('hard')"><b>ハードモード</b>成立性確認付きランダムマップ</button><button onclick="chooseGameMode('debug')"><b>デバッグモード</b>ランダムマップ＋自機無敵</button></div></div></div>
<div id="end"><div class="panel"><h2 id="endTitle"></h2><div id="report"></div><button onclick="resetGame()"><b>再出撃</b>作戦を最初から開始</button></div></div></div>
<div id="controls">
<button id="moveBtn" class="active" onclick="setMode('move')"><b>進軍指示</b><span class="hint">地図上の目的地を指定</span></button>
<button id="strafeBtn" onclick="setMode('strafe')"><b>戦闘機 <span id="airCd">READY</span></b><span class="hint">始点と終点を順に指定</span></button>
<button id="navalBtn" onclick="setMode('naval')"><b>艦砲射撃 <span id="navalCd">READY</span></b><span class="hint">爆撃中心を指定</span></button>
<button id="formBtn" onclick="cycleFormation()"><b>隊形：<span id="formName">密集</span></b><span class="hint">密集 → 散開 → 一列</span></button>
<button id="abort" onclick="togglePause()"><b id="pauseText">一時停止</b><span class="hint">戦況を確認</span></button>
</div></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,DPR;
const world={w:3600,h:2400},view={w:1400,h:900};let camera={x:0,y:1500};let state,units,allies,enemies,effects,bullets,mode='move',firstPoint=null,last=0,missionSeq=0,gameMode='normal';
const base={x:3330,y:260,r:62},extract={x:180,y:2180,r:72};
const FIXED_RIVERS=[{x:0,y:1680,w:3600,h:125},{x:0,y:900,w:3600,h:115}],FIXED_BRIDGES=[{x:540,y:1660,w:150,h:165},{x:1510,y:1660,w:150,h:165},{x:2780,y:1660,w:150,h:165},{x:780,y:880,w:150,h:155},{x:1990,y:880,w:150,h:155},{x:3100,y:880,w:150,h:155}],FIXED_OBSTACLES=[{x:260,y:1840,w:170,h:210},{x:750,y:1880,w:250,h:190},{x:1130,y:1830,w:220,h:350},{x:1740,y:1900,w:340,h:180},{x:2220,y:1840,w:190,h:300},{x:3020,y:1870,w:260,h:210},{x:260,y:1240,w:250,h:220},{x:760,y:1110,w:180,h:360},{x:1120,y:1360,w:330,h:170},{x:1710,y:1130,w:210,h:400},{x:2260,y:1260,w:370,h:170},{x:2920,y:1110,w:200,h:390},{x:350,y:420,w:200,h:300},{x:900,y:540,w:350,h:160},{x:1470,y:260,w:190,h:430},{x:1880,y:500,w:360,h:160},{x:2440,y:260,w:210,h:440},{x:2900,y:470,w:300,h:170},{x:3280,y:1050,w:180,h:310}];let rivers=[],bridges=[],obstacles=[];
function resize(){const box=document.getElementById('stage').getBoundingClientRect(),aspect=view.w/view.h;let w=box.width,h=w/aspect;if(h>box.height){h=box.height;w=h*aspect}w=Math.max(1,w);h=Math.max(1,h);canvas.style.width=w+'px';canvas.style.height=h+'px';DPR=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*DPR);canvas.height=Math.round(h*DPR);W=w;H=h;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,100));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resetGame(){
 if(gameMode==='normal'){rivers=structuredClone(FIXED_RIVERS);bridges=structuredClone(FIXED_BRIDGES);obstacles=structuredClone(FIXED_OBSTACLES)}else generateRandomMap();
 state={mission:++missionSeq,time:0,phase:1,paused:false,over:false,rescued:false,vipAlive:true,vipHp:100,friendlyHits:0,baseHits:0,kills:0,tankKills:0,air:0,naval:0,reinforce:0,formation:'dense',heading:-Math.PI/4,idle:0,encircleWarned:false,whiteFlash:0,debug:gameMode==='debug'};mode='move';firstPoint=null;
 units=[{x:180,y:2180,hp:100,leader:true,name:'ALPHA',tx:180,ty:2180},{x:140,y:2220,hp:100,name:'BRAVO'},{x:220,y:2220,hp:100,name:'CHARLIE'},{x:140,y:2140,hp:100,name:'DELTA'}];camera={x:0,y:1500};
 allies=[{x:520,y:1450,hp:100,name:'ECHO',route:[{x:520,y:1450},{x:1330,y:1450}]},{x:1320,y:1080,hp:100,name:'FOXTROT',route:[{x:1320,y:1080},{x:1950,y:1080}]},{x:2250,y:720,hp:100,name:'GOLF',route:[{x:2250,y:720},{x:2870,y:720}]},{x:3050,y:760,hp:100,name:'HOTEL',route:[{x:3050,y:760},{x:3380,y:620}]},{x:2400,y:1550,hp:100,name:'INDIA',route:[{x:2400,y:1550},{x:3200,y:1500}]}];allies.forEach(a=>{a.ri=1;a.cd=Math.random()});
 if(gameMode!=='normal')allies.forEach(a=>{let p=randomFreePoint(),q=randomFreePoint(p);a.x=p.x;a.y=p.y;a.route=[p,q]});
 enemies=[];effects=[];bullets=[];spawnWave(82,false);spawnTanks(10,false);document.getElementById('formName').textContent='密集';document.getElementById('modeStatus').textContent={normal:'NORMAL',hard:'HARD',debug:'DEBUG'}[gameMode];document.getElementById('end').style.display='none';setMode('move');flash(gameMode==='normal'?'作戦開始。敵戦車を確認。支援火力で排除せよ。':gameMode==='hard'?'ハードモード：到達性確認済みランダムマップ':'デバッグモード：ランダムマップ／指揮下部隊無敵',2800);updateUI();last=performance.now();const run=state.mission;requestAnimationFrame(t=>loop(t,run))
}
function freePoint(x,y){const blockedBuilding=obstacles.some(o=>x>o.x-22&&x<o.x+o.w+22&&y>o.y-22&&y<o.y+o.h+22),inRiver=rivers.some(r=>x>r.x&&x<r.x+r.w&&y>r.y&&y<r.y+r.h),onBridge=bridges.some(b=>x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h);return !blockedBuilding&&(!inRiver||onBridge)}
const rand=(a,b)=>a+Math.random()*(b-a),overlap=(a,b,p=25)=>a.x-p<b.x+b.w&&a.x+a.w+p>b.x&&a.y-p<b.y+b.h&&a.y+a.h+p>b.y;
function mapReachable(){const step=60,cols=Math.ceil(world.w/step),rows=Math.ceil(world.h/step),sx=Math.floor(extract.x/step),sy=Math.floor(extract.y/step),gx=Math.floor(base.x/step),gy=Math.floor(base.y/step),q=[[sx,sy]],seen=new Set([sx+','+sy]);for(let qi=0;qi<q.length;qi++){const [x,y]=q[qi];if(Math.abs(x-gx)<=1&&Math.abs(y-gy)<=1)return true;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,k=nx+','+ny;if(nx>=0&&ny>=0&&nx<cols&&ny<rows&&!seen.has(k)&&freePoint(nx*step+step/2,ny*step+step/2)){seen.add(k);q.push([nx,ny])}}}return false}
function generateRandomMap(){for(let attempt=0;attempt<40;attempt++){const ys=[rand(760,990),rand(1480,1720)].sort((a,b)=>a-b);rivers=ys.map(y=>({x:0,y,w:world.w,h:110+Math.random()*35}));bridges=[];rivers.forEach(r=>{[0,1,2].forEach(zone=>{const x=zone*1200+rand(230,930);bridges.push({x,y:r.y-20,w:160,h:r.h+40})})});obstacles=[];for(let tries=0;tries<500&&obstacles.length<25;tries++){const o={x:rand(100,3350),y:rand(100,2180),w:rand(130,350),h:rand(110,330)},nearKey=Math.hypot(o.x+o.w/2-extract.x,o.y+o.h/2-extract.y)<300||Math.hypot(o.x+o.w/2-base.x,o.y+o.h/2-base.y)<230;if(nearKey||rivers.some(r=>overlap(o,r,15))||bridges.some(b=>overlap(o,b,70))||obstacles.some(b=>overlap(o,b,35)))continue;obstacles.push(o)}if(mapReachable())return}rivers=structuredClone(FIXED_RIVERS);bridges=structuredClone(FIXED_BRIDGES);obstacles=structuredClone(FIXED_OBSTACLES)}
function randomFreePoint(near){for(let i=0;i<150;i++){const p={x:near?clamp(near.x+rand(-600,600),80,world.w-80):rand(350,world.w-250),y:near?clamp(near.y+rand(-350,350),80,world.h-80):rand(250,world.h-250)};if(freePoint(p.x,p.y)&&Math.hypot(p.x-extract.x,p.y-extract.y)>300&&Math.hypot(p.x-base.x,p.y-base.y)>180)return p}return{x:1800,y:1200}}
function spawnWave(n,reinforce){for(let i=0;i<n;i++){let x,y,k=0;do{x=reinforce?1700+Math.random()*1750:420+Math.random()*3000;y=100+Math.random()*2150;k++}while((!freePoint(x,y)||Math.hypot(x-base.x,y-base.y)<100||Math.hypot(x-extract.x,y-extract.y)<260)&&k<100);enemies.push({x,y,hp:reinforce?65:55,cd:Math.random()*2,alert:false})}}
function spawnTanks(n,reinforce){for(let i=0;i<n;i++){let x,y,k=0;do{x=reinforce?1500+Math.random()*1900:650+Math.random()*2750;y=130+Math.random()*2050;k++}while((!freePoint(x,y)||Math.hypot(x-extract.x,y-extract.y)<320||Math.hypot(x-base.x,y-base.y)<130)&&k<120);enemies.push({x,y,hp:110,cd:1+Math.random()*2,alert:false,armored:true})}}
function setMode(m){if(state?.over)return;if(m==='strafe'&&state.air>0)return;if(m==='naval'&&state.naval>0)return;mode=m;firstPoint=null;['move','strafe','naval'].forEach(x=>document.getElementById(x+'Btn').classList.toggle('active',x===m));if(m==='strafe')flash('掃射開始点を指定',1300);if(m==='naval')flash('艦砲射撃地点を指定',1300)}
function cycleFormation(){if(state.over)return;const order=['dense','spread','column'],names={dense:'密集',spread:'散開',column:'一列'},i=(order.indexOf(state.formation)+1)%order.length;state.formation=order[i];document.getElementById('formName').textContent=names[state.formation];flash('隊形変更：'+names[state.formation],1100)}
function chooseGameMode(selected){gameMode=selected;document.getElementById('start').style.display='none';resetGame()}
function screenToWorld(e){const r=canvas.getBoundingClientRect(),sx=(e.clientX-r.left)/r.width,sy=(e.clientY-r.top)/r.height;return{x:camera.x+sx*view.w,y:camera.y+sy*view.h}}
canvas.addEventListener('pointerdown',e=>{if(state.paused||state.over)return;const p=screenToWorld(e);if(mode==='move'){const lead=getLeader();if(!lead)return;lead.tx=clamp(p.x,25,world.w-25);lead.ty=clamp(p.y,25,world.h-25);effects.push({type:'marker',x:p.x,y:p.y,t:1})}else if(mode==='strafe'){if(!firstPoint){firstPoint=p;flash('掃射終了点を指定',1200)}else{callStrafe(firstPoint,p);firstPoint=null;setMode('move')}}else callNaval(p)});
function segmentDist(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,q=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy||1),0,1);return Math.hypot(p.x-(a.x+q*dx),p.y-(a.y+q*dy))}
function callStrafe(a,b){state.air=25;const mission=state.mission,hit=p=>segmentDist(p,a,b)<34;effects.push({type:'warningLine',a,b,t:10.2,duration:10.2});flash('航空支援要請受理。正確な掃射まで10秒',1800);setTimeout(()=>{if(state.over||state.mission!==mission)return;state.whiteFlash=1;effects.push({type:'strafeLine',a,b,t:1.2});enemies.forEach(e=>{if(hit(e))damageEnemy(e,9999,true)});units.forEach(u=>{if(u.hp>0&&hit(u))friendlyFire(u,52,'機銃掃射')});allies.forEach(u=>{if(u.hp>0&&hit(u))friendlyFire(u,70,'機銃掃射')});if(state.rescued&&hit(vip()))damageVip(65,'機銃掃射');if(!state.rescued&&hit(base)){state.baseHits++;flash('警告：救出対象収容施設に機銃弾が命中',2400)}},10000)}
function callNaval(p){state.naval=27;const mission=state.mission;effects.push({type:'warningCircle',x:p.x,y:p.y,r:115,t:10.2,duration:10.2});flash('艦砲射撃要請受理。正確な着弾まで10秒',1800);setTimeout(()=>{if(state.over||state.mission!==mission)return;state.whiteFlash=1;effects.push({type:'blast',x:p.x,y:p.y,r:115,t:1});enemies.forEach(e=>{if(dist(e,p)<115)damageEnemy(e,9999,true)});units.forEach(u=>{if(u.hp>0&&dist(u,p)<115)friendlyFire(u,90,'艦砲射撃')});allies.forEach(u=>{if(u.hp>0&&dist(u,p)<115)friendlyFire(u,100,'艦砲射撃')});if(state.rescued&&dist(vip(),p)<115)damageVip(100,'艦砲射撃');if(!state.rescued&&(dist(base,p)<base.r+115)){state.baseHits++;state.vipHp-=45;flash('重大警告：敵拠点を砲撃。救出対象の生存性低下',2600);if(state.vipHp<=0)finish(false,'救出対象死亡')}},10000);setMode('move')}
function friendlyFire(u,d,src){if(state.debug&&units.includes(u)){flash('DEBUG：'+u.name+' への損害を無効化',1300);return}u.hp=Math.max(0,u.hp-d);state.friendlyHits++;flash('誤射発生：'+src+'により '+u.name+' が損害',2500);if(units.includes(u)&&u.hp<=0)promoteLeader();if(aliveUnits()===0)finish(false,'部隊全滅')}
function damageVip(d,src){state.vipHp-=d;flash('重大誤射：'+src+'が重要人物を巻き込んだ',2500);if(state.vipHp<=0){state.vipAlive=false;finish(false,'救出対象死亡')}}
function damageEnemy(e,d,support=false){if(e.hp<=0)return;if(e.armored&&!support){if(!e.armorNotice||state.time-e.armorNotice>5){e.armorNotice=state.time;flash('小銃弾は戦車装甲に無効。支援火力を要請せよ。',1500)}return}e.hp-=d;if(e.hp<=0){state.kills++;if(e.armored)state.tankKills++}}
function aliveUnits(){return units.filter(u=>u.hp>0).length}function getLeader(){return units.find(u=>u.leader&&u.hp>0)||units.find(u=>u.hp>0)}
function promoteLeader(){const old=units.find(u=>u.leader),next=units.find(u=>u.hp>0&&u!==old);if(old&&old.hp>0)return;units.forEach(u=>u.leader=false);if(next){next.leader=true;next.tx=old?.tx??next.x;next.ty=old?.ty??next.y;flash(old.name+' 戦闘不能。'+next.name+' が指揮を継承。',2600)}}
function vip(){const a=getLeader()||units[0];return{x:a.x-25,y:a.y+28}}
function solidMove(o,dx,dy){let nx=clamp(o.x+dx,15,world.w-15),ny=clamp(o.y+dy,15,world.h-15);if(freePoint(nx,o.y))o.x=nx;if(freePoint(o.x,ny))o.y=ny}
function update(dt){state.time+=dt;state.air=Math.max(0,state.air-dt);state.naval=Math.max(0,state.naval-dt);state.whiteFlash=Math.max(0,state.whiteFlash-dt*1.8);const lead=getLeader();let moving=false;if(lead){let dx=lead.tx-lead.x,dy=lead.ty-lead.y,L=Math.hypot(dx,dy);if(L>5){const ox=lead.x,oy=lead.y;state.heading=Math.atan2(dy,dx);solidMove(lead,dx/L*105*dt,dy/L*105*dt);moving=Math.hypot(lead.x-ox,lead.y-oy)>.1}}if(moving){state.idle=0;state.encircleWarned=false}else{state.idle+=dt;if(state.idle>4&&!state.encircleWarned){state.encircleWarned=true;flash('警告：停止を察知した敵部隊が左右後方へ展開中',2200)}}
 const formations={dense:[{lat:-38,back:42},{lat:38,back:42},{lat:0,back:78}],spread:[{lat:-105,back:68},{lat:105,back:68},{lat:0,back:145}],column:[{lat:0,back:58},{lat:0,back:116},{lat:0,back:174}]},form=formations[state.formation],h=state.heading;units.filter(u=>u.hp>0&&u!==lead).forEach((u,i)=>{const slot=form[i];if(!lead||!slot)return;let tx=lead.x-Math.cos(h)*slot.back-Math.sin(h)*slot.lat,ty=lead.y-Math.sin(h)*slot.back+Math.cos(h)*slot.lat,dx=tx-u.x,dy=ty-u.y,L=Math.hypot(dx,dy);if(L>10)solidMove(u,dx/L*100*dt,dy/L*100*dt)});
 allies.forEach(a=>{if(a.hp<=0)return;const goal=a.route[a.ri],dx=goal.x-a.x,dy=goal.y-a.y,L=Math.hypot(dx,dy);if(L<25)a.ri=(a.ri+1)%a.route.length;else solidMove(a,dx/L*48*dt,dy/L*48*dt);a.cd-=dt;const target=enemies.filter(e=>e.hp>0&&dist(a,e)<185).sort((x,y)=>dist(a,x)-dist(a,y))[0];if(target&&a.cd<=0){a.cd=.65;target.alert=true;bullets.push({x:a.x,y:a.y,tx:target.x,ty:target.y,t:.16,friendly:true});damageEnemy(target,15+Math.random()*8)}});
 units.forEach(u=>{if(u.hp<=0)return;u.cd=(u.cd||0)-dt;let target=enemies.filter(e=>e.hp>0&&dist(u,e)<205).sort((a,b)=>dist(u,a)-dist(u,b))[0];if(target&&u.cd<=0){u.cd=.48;target.alert=true;bullets.push({x:u.x,y:u.y,tx:target.x,ty:target.y,t:.16,friendly:true});damageEnemy(target,18+Math.random()*10)}});
