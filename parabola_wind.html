<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PARABOLA WIND</title>
<style>
:root{color-scheme:dark;--bg:#07111c;--panel:#0d1b2a;--text:#edf4ff;--muted:#8fa7bf;--line:#294158;--accent:#63b3ff;--wind:#6bc7ff;--trail:#f5f7fa;--ghost:#9aa7b5;--target:#ffd166;--pass:#65e6a5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
main{width:min(1180px,96%);margin:auto;padding:18px 0 34px}.top{display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:clamp(1.35rem,4vw,2.2rem);margin:0}.sub{color:var(--muted);font-size:.9rem}.field{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#091522}
canvas{display:block;width:100%;height:auto;touch-action:none}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.speedrow{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}
input[type=range]{width:100%;accent-color:var(--accent)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.label{font-size:.75rem;color:var(--muted)}.value{font-size:1.15rem;font-weight:700}.fire{width:100%;min-height:58px;margin-top:12px;border:0;border-radius:12px;background:var(--accent);color:#04111d;font-size:1.05rem;font-weight:800}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions button{min-height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.82rem;margin-top:9px}.sw{display:inline-block;width:28px;vertical-align:middle;margin-right:5px;border-top:3px solid}.ghost{border-top-style:dashed;border-color:var(--ghost)}.actual{border-color:var(--trail)}.wind{border-color:var(--wind)}
@media(max-width:680px){.controls{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main>
<div class="top"><div><h1>PARABOLA WIND</h1><div class="sub">風を読み、チェックポイントを通し、滞空時間を伸ばせ。</div></div><div id="status" class="sub">長押しして発射準備</div></div>
<div class="field"><canvas id="c" width="1200" height="760"></canvas></div>
<div class="legend"><span><i class="sw wind"></i>局所風</span><span><i class="sw ghost"></i>発射時の無風軌道</span><span><i class="sw actual"></i>実軌道</span></div>
<button class="fire" id="fire">長押しして、離すと発射</button>
<div class="controls">
<div class="card"><div class="speedrow"><b>発射速度</b><b><span id="sv">45</span> m/s</b></div><input id="speed" type="range" min="10" max="80" step="1" value="45"></div>
<div class="card stats"><div><div class="label">角度</div><div class="value" id="av">0.0°</div></div><div><div class="label">滞空</div><div class="value" id="tv">0.00</div></div><div><div class="label">今回</div><div class="value" id="score">0.00</div></div><div><div class="label">BEST</div><div class="value" id="best">0.00</div></div></div>
</div>
<div class="actions"><button id="target">チェックポイント変更</button><button id="reset">リセット</button></div>
</main>
<script>
(()=>{
const c=document.getElementById("c"),x=c.getContext("2d"),speedEl=document.getElementById("speed"),sv=document.getElementById("sv"),av=document.getElementById("av"),tv=document.getElementById("tv"),scoreEl=document.getElementById("score"),bestEl=document.getElementById("best"),statusEl=document.getElementById("status"),fireBtn=document.getElementById("fire");
const g=9.81,launcher={x:60,y:700},Wm=300,Hm=300,px=1100/Wm,py=640/Hm,targetMax=70,targetR=5.5;
let speed=45,angle=0,dir=1,holding=false,angleRAF=0,shotRAF=0,renderRAF=0,lastAngle=0,proj=null,trail=[],ghost=[],passed=false,flight=0,best=0,phase=0,lastRender=performance.now(),target=makeTarget();
const reduced=matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function X(m){return launcher.x+m*px} function Y(m){return launcher.y-m*py}
function makeTarget(){return{x:80+Math.random()*160,y:10+Math.random()*(targetMax-10)}}
function wind(xm,ym){return{x:4.2*Math.sin(xm/37+.7)+2*Math.cos(ym/22+.6)+1.3*Math.sin((xm+ym)/60),y:2.1*Math.cos(xm/54-.3)-1.6*Math.sin(ym/28+.4)+Math.cos((xm-ym)/52)}}
function grid(){x.strokeStyle="#1d3448";x.fillStyle="#7890a7";x.lineWidth=1;x.font="13px system-ui";for(let m=0;m<=300;m+=25){let q=X(m);x.beginPath();x.moveTo(q,0);x.lineTo(q,720);x.stroke();if(m%50===0)x.fillText(m+" m",Math.min(q-14,1152),742)}for(let m=0;m<=300;m+=25){let q=Y(m);x.beginPath();x.moveTo(0,q);x.lineTo(1200,q);x.stroke();if(m>0&&m%50===0)x.fillText(m+" m",8,q-5)}}
function windField(){x.save();x.strokeStyle="#6bc7ff";x.fillStyle="#8bd5ff";x.lineWidth=1.15;for(let xm=10;xm<300;xm+=14)for(let ym=8;ym<300;ym+=15){const w=wind(xm,ym),mag=Math.hypot(w.x,w.y),sm=Math.max(mag,.001),len=5+Math.min(17,mag*1.8),dx=w.x/sm*len,dy=-w.y/sm*len,cx=X(xm),cy=Y(ym);x.globalAlpha=.32;x.beginPath();x.moveTo(cx-dx/2,cy-dy/2);x.lineTo(cx+dx/2,cy+dy/2);x.stroke();if(!reduced){const p=(phase*(.45+mag*.08)+xm*.031+ym*.043)%1;x.globalAlpha=.95;x.beginPath();x.arc(cx-dx/2+dx*p,cy-dy/2+dy*p,1.4+Math.min(2,mag*.11),0,Math.PI*2);x.fill()}}x.restore()}
function drawTarget(){const cx=X(target.x),cy=Y(target.y),r=targetR*px;x.save();x.strokeStyle=passed?"#65e6a5":"#ffd166";x.lineWidth=5;x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.stroke();x.lineWidth=2;x.beginPath();x.arc(cx,cy,r*.55,0,Math.PI*2);x.stroke();x.fillStyle=x.strokeStyle;x.font="bold 15px system-ui";x.textAlign="center";x.fillText(passed?"PASS":"CHECK",cx,cy-r-9);x.fillText(target.y.toFixed(0)+" m",cx,cy+r+20);x.restore()}
function line(points,dashed,color,width){if(points.length<2)return;x.save();x.strokeStyle=color;x.lineWidth=width;if(dashed)x.setLineDash([8,6]);x.beginPath();x.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)x.lineTo(points[i].x,points[i].y);x.stroke();x.restore()}
function launcherDraw(){const r=angle*Math.PI/180,L=65;x.strokeStyle="#eaf2fb";x.lineWidth=10;x.lineCap="round";x.beginPath();x.moveTo(launcher.x,launcher.y);x.lineTo(launcher.x+Math.cos(r)*L,launcher.y-Math.sin(r)*L);x.stroke();x.lineCap="butt";x.fillStyle="#eaf2fb";x.beginPath();x.arc(launcher.x,launcher.y,15,0,Math.PI*2);x.fill()}
function draw(){x.clearRect(0,0,c.width,c.height);x.fillStyle="#091522";x.fillRect(0,0,c.width,c.height);grid();windField();drawTarget();x.strokeStyle="#a7bacb";x.lineWidth=2;x.beginPath();x.moveTo(0,720);x.lineTo(1200,720);x.stroke();line(ghost,true,"#9aa7b5",2);line(trail,false,passed?"#65e6a5":"#f5f7fa",3);launcherDraw();if(proj){x.fillStyle="#fff";x.beginPath();x.arc(proj.x,proj.y,7,0,Math.PI*2);x.fill()}}
function ghostPath(v,r){const a=[],vx=v*Math.cos(r),vy=v*Math.sin(r),T=vy>0?2*vy/g:0;for(let t=0;t<=T+.05;t+=.05){const xm=vx*t,ym=vy*t-.5*g*t*t;if(xm>Wm)break;a.push({x:X(xm),y:Y(Math.max(0,ym))});if(ym<=0&&t>.05)break}return a}
function render(now){const dt=Math.min(.05,(now-lastRender)/1000);lastRender=now;if(!reduced)phase+=dt;draw();renderRAF=requestAnimationFrame(render)}
function stopShot(){if(shotRAF)cancelAnimationFrame(shotRAF);shotRAF=0;proj=null}
function startHold(){if(holding)return;stopShot();holding=true;lastAngle=performance.now();statusEl.textContent="発射準備中…離すと発射";fireBtn.textContent="離すと発射";const tick=now=>{if(!holding)return;const dt=Math.min(.05,(now-lastAngle)/1000);lastAngle=now;angle+=dir*45*dt;if(angle>=90){angle=90;dir=-1}if(angle<=0){angle=0;dir=1}av.textContent=angle.toFixed(1)+"°";angleRAF=requestAnimationFrame(tick)};angleRAF=requestAnimationFrame(tick)}
function release(){if(!holding)return;holding=false;if(angleRAF)cancelAnimationFrame(angleRAF);angleRAF=0;fireBtn.textContent="長押しして、離すと発射";shoot()}
function shoot(){stopShot();trail=[];passed=false;flight=0;scoreEl.textContent="0.00";const r=angle*Math.PI/180;ghost=ghostPath(speed,r);let xm=0,ym=0,vx=speed*Math.cos(r),vy=speed*Math.sin(r),last=performance.now();statusEl.textContent="発射！ リングを通せ";const tick=now=>{const dt=Math.min(.03,(now-last)/1000);last=now;const w=wind(xm,Math.max(0,ym)),drag=.15;vx+=drag*(w.x-vx)*dt;vy+=(-g+drag*(w.y-vy))*dt;xm+=vx*dt;ym+=vy*dt;flight+=dt;if(!passed&&Math.hypot(xm-target.x,ym-target.y)<=targetR){passed=true;statusEl.textContent="CHECKPOINT PASS！ あとは長く飛べ"}proj={x:X(xm),y:Y(ym)};trail.push({...proj});if(trail.length>1800)trail.shift();tv.textContent=flight.toFixed(2);if(passed)scoreEl.textContent=flight.toFixed(2);if((ym<=0&&flight>.08)||xm>=Wm||ym>=Hm||xm<-5){proj=null;if(passed){best=Math.max(best,flight);scoreEl.textContent=flight.toFixed(2);bestEl.textContent=best.toFixed(2);statusEl.textContent="SCORE "+flight.toFixed(2)+" 秒"}else{scoreEl.textContent="0.00";statusEl.textContent="MISS — チェックポイント未通過"}shotRAF=0;return}shotRAF=requestAnimationFrame(tick)};shotRAF=requestAnimationFrame(tick)}
speedEl.addEventListener("input",()=>{speed=Math.max(10,Math.min(80,Number(speedEl.value)||45));sv.textContent=speed});
fireBtn.addEventListener("pointerdown",e=>{e.preventDefault();fireBtn.setPointerCapture?.(e.pointerId);startHold()});fireBtn.addEventListener("pointerup",e=>{e.preventDefault();release()});fireBtn.addEventListener("pointercancel",release);fireBtn.addEventListener("lostpointercapture",()=>{if(holding)release()});
fireBtn.addEventListener("keydown",e=>{if((e.code==="Space"||e.code==="Enter")&&!e.repeat){e.preventDefault();startHold()}});fireBtn.addEventListener("keyup",e=>{if(e.code==="Space"||e.code==="Enter"){e.preventDefault();release()}});
document.getElementById("target").addEventListener("click",()=>{stopShot();target=makeTarget();passed=false;trail=[];ghost=[];tv.textContent="0.00";scoreEl.textContent="0.00";statusEl.textContent="新しいチェックポイント"});
document.getElementById("reset").addEventListener("click",()=>{stopShot();holding=false;if(angleRAF)cancelAnimationFrame(angleRAF);angle=0;dir=1;trail=[];ghost=[];passed=false;flight=0;best=0;target=makeTarget();av.textContent="0.0°";tv.textContent="0.00";scoreEl.textContent="0.00";bestEl.textContent="0.00";statusEl.textContent="長押しして発射準備"});
draw();renderRAF=requestAnimationFrame(render);
})();
</script>
</body>
</html>
