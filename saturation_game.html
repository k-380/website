<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SATURATION</title><style>
:root{color-scheme:dark;--bg:#0b0d10;--panel:#151920;--text:#f4f6f8;--muted:#98a2ad}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Noto Sans JP",sans-serif}main{max-width:760px;margin:auto;padding:22px 16px 40px}header,.top{display:flex;justify-content:space-between;align-items:end;gap:12px}h1{margin:0;font-size:clamp(28px,8vw,48px);letter-spacing:.13em}.sub,.round,.legend,.ref-title{color:var(--muted);font-size:12px}.score{text-align:right}.score b{font-size:26px}.card{margin-top:18px;background:var(--panel);border:1px solid #2a3039;border-radius:20px;padding:16px}.instruction{font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}.tile{aspect-ratio:1.15;border:0;border-radius:17px;box-shadow:inset 0 0 0 1px #ffffff18}.tile:active{transform:scale(.97)}.tile.done{opacity:.18;pointer-events:none}.tile.wrong{animation:shake .25s}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}.status{height:28px;text-align:center;margin-top:14px;font-weight:750}.controls{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}select,.action{background:#20252d;color:var(--text);border:1px solid #343b46;border-radius:12px;padding:11px 13px;font:inherit}.action{font-weight:750;flex:1}.legend{margin-top:16px;line-height:1.65}.ref{text-align:center;margin-top:22px}.wheel{width:min(260px,70vw);aspect-ratio:1;border-radius:50%;margin:10px auto;position:relative;background:conic-gradient(red,#ff0,#0f0,#0ff,#00f,#f0f,red)}.wheel:after{content:"";position:absolute;inset:24%;border-radius:50%;background:var(--bg)}.lab{position:absolute;z-index:2;font-size:11px;font-weight:800;text-shadow:0 1px 4px #000}.h0{top:4%;left:50%;transform:translateX(-50%)}.h90{right:3%;top:50%}.h180{bottom:4%;left:50%;transform:translateX(-50%)}.h270{left:3%;top:50%}.overlay{position:fixed;inset:0;background:#050709dd;display:flex;align-items:center;justify-content:center}.hidden{display:none}.dialog{background:#171b21;border-radius:22px;padding:28px;text-align:center}.big{font-size:42px;font-weight:900}@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}</style></head><body><main>
<header><div><h1>SATURATION</h1><div class="sub">鮮やかさと色相を見抜け。</div></div><div class="score"><small>SCORE</small><br><b id="score">0</b></div></header>
<section class="card"><div class="top"><div id="instruction" class="instruction"></div><div id="round" class="round"></div></div><div id="grid" class="grid"></div><div id="status" class="status"></div></section>
<div class="controls"><select id="mode"><option value="saturation">彩度モード</option><option value="hue">色相モード</option></select><select id="difficulty"><option value="easy">EASY</option><option value="normal" selected>NORMAL</option><option value="hard">HARD</option><option value="hell">HELL</option></select><button id="restart" class="action">最初から</button></div>
<div id="legend" class="legend"></div><div class="ref"><div class="ref-title">REFERENCE — HSL 色相環</div><div class="wheel"><span class="lab h0">0°</span><span class="lab h90">90°</span><span class="lab h180">180°</span><span class="lab h270">270°</span></div></div></main>
<div id="overlay" class="overlay hidden"><div class="dialog"><h2>FINISH</h2><div id="final" class="big"></div><button id="again" class="action">もう一度</button></div></div>
<script>
const $=s=>document.querySelector(s),grid=$("#grid"),mode=$("#mode"),diff=$("#difficulty"),status=$("#status"),scoreEl=$("#score"),instruction=$("#instruction"),legend=$("#legend"),overlay=$("#overlay");let round=1,score=0,next=0,mistakes=0,locked=false,count=0;
const cfg={easy:{n:4,s:14,h:12},normal:{n:5,s:9,h:7},hard:{n:6,s:5,h:4},hell:{n:6,s:3,h:2}},rnd=(a,b)=>Math.floor(Math.random()*(b-a)+a),shuffle=a=>a.sort(()=>Math.random()-.5);
function newRound(){locked=false;next=0;mistakes=0;status.textContent="";let c=cfg[diff.value],items=[];
if(mode.value==="saturation"){instruction.textContent="彩度が低い順にタップ";legend.textContent="色相・明度を固定し、彩度だけを変えています。";let h=rnd(0,360),l=rnd(43,62),start=rnd(8,Math.max(9,93-c.s*(c.n-1)));items=Array.from({length:c.n},(_,i)=>({rank:i,h,s:start+i*c.s,l}));}
else{instruction.textContent="色相値（H）が小さい順にタップ";legend.textContent="彩度・明度を固定し、色相だけを微妙にずらしています。0°/360°境界はまたぎません。";let span=c.h*(c.n-1),start=rnd(0,361-span),s=rnd(62,88),l=rnd(45,58);items=Array.from({length:c.n},(_,i)=>({rank:i,h:start+i*c.h,s,l}));}
count=items.length;grid.innerHTML="";shuffle(items).forEach(x=>{let b=document.createElement("button");b.className="tile";b.style.background=`hsl(${x.h} ${x.s}% ${x.l}%)`;b.onclick=()=>tap(b,x.rank);grid.appendChild(b)});$("#round").textContent=`ROUND ${round} / 10`;}
function tap(el,rank){if(locked||el.classList.contains("done"))return;if(rank===next){el.classList.add("done");next++;score+=Math.max(2,10-mistakes*2);scoreEl.textContent=score;if(next===count){locked=true;status.textContent=mistakes?"CLEAR":"PERFECT!";setTimeout(()=>round>=10?finish():(round++,newRound()),650)}}else{mistakes++;score=Math.max(0,score-5);scoreEl.textContent=score;status.textContent=mode.value==="saturation"?"違う。まだ彩度の低い色があります":"違う。まだ色相値（H）の小さい色があります";el.classList.remove("wrong");void el.offsetWidth;el.classList.add("wrong")}}
function reset(){round=1;score=0;scoreEl.textContent=0;overlay.classList.add("hidden");newRound()}function finish(){$("#final").textContent=score+" pts";overlay.classList.remove("hidden")}mode.onchange=diff.onchange=reset;$("#restart").onclick=$("#again").onclick=reset;newRound();
</script></body></html>
