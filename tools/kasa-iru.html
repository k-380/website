<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>傘いる？</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;display:grid;place-items:center;background:#0b1220;color:#eef5ff;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
  main{width:min(92vw,560px);text-align:center;padding:28px}
  .icon{font-size:72px;line-height:1}
  h1{font-size:clamp(46px,14vw,84px);margin:16px 0 8px;letter-spacing:.02em}
  #sub{color:#aebbd0;font-size:16px;line-height:1.7;min-height:54px}
  #details{margin-top:18px;font-size:14px;color:#8291a8;line-height:1.7}
  button{margin-top:24px;border:0;border-radius:999px;padding:14px 22px;font-weight:700;font-size:16px;background:#eef5ff;color:#0b1220}
  .yes{color:#79c7ff}.maybe{color:#ffd56a}.no{color:#83e6a0}.err{color:#ff9a9a}
  .spinner{width:38px;height:38px;border:4px solid #26344c;border-top-color:#eef5ff;border-radius:50%;animation:s .8s linear infinite;margin:20px auto}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main>
  <div id="icon" class="icon">📍</div>
  <div id="spin" class="spinner"></div>
  <h1 id="answer">判定中</h1>
  <div id="location" style="margin-top:14px;font-size:18px;font-weight:700">📍 現在地を取得中…</div>
  <div id="sub">現在地を取得して、雨を確認しています。</div>
  <div id="details"></div>
  <button id="retry" hidden>もう一度判定</button>
</main>
<script>
const $=id=>document.getElementById(id);
const answer=$("answer"), sub=$("sub"), details=$("details"), icon=$("icon"), spin=$("spin"), retry=$("retry"), locationEl=$("location");

function fail(msg){
  spin.hidden=true; icon.textContent="⚠️"; answer.textContent="判定できません"; answer.className="err";
  sub.textContent=msg; retry.hidden=false;
}
async function judge(lat,lon,accuracy){
  try{
    // 緯度経度から市区町村名を取得
    locationEl.textContent = `📍 ${lat.toFixed(4)}, ${lon.toFixed(4)}`;
    try {
      const geoUrl = new URL("https://nominatim.openstreetmap.org/reverse");
      geoUrl.search = new URLSearchParams({
        lat: lat, lon: lon, format: "jsonv2",
        "accept-language": "ja", zoom: "10"
      });
      const gr = await fetch(geoUrl, {headers: {"Accept": "application/json"}});
      if (gr.ok) {
        const g = await gr.json();
        const a = g.address || {};
        const city = a.city || a.town || a.village || a.municipality || a.county;
        const pref = a.state;
        if (city || pref) locationEl.textContent = `📍 ${[pref, city].filter(Boolean).join(" ")}`;
      }
    } catch (_) {}

    const url=new URL("https://api.open-meteo.com/v1/forecast");
    url.search=new URLSearchParams({
      latitude:lat, longitude:lon,
      hourly:"precipitation_probability,precipitation,weather_code",
      forecast_days:"2", timezone:"auto"
    });
    const r=await fetch(url);
    if(!r.ok) throw new Error();
    const d=await r.json();
    const nowDate = new Date();
    const now = nowDate.getTime();
    const hour = nowDate.getHours();

    // 判定時間帯
    // 09:00まで       → 当日20:00まで
    // 09:00〜18:00未満 → 現在から6時間
    // 18:00以降       → 翌日20:00まで
    let endDate;
    if (hour < 9) {
      endDate = new Date(nowDate);
      endDate.setHours(20, 0, 0, 0);
    } else if (hour < 18) {
      endDate = new Date(now + 6 * 60 * 60 * 1000);
    } else {
      endDate = new Date(nowDate);
      endDate.setDate(endDate.getDate() + 1);
      endDate.setHours(20, 0, 0, 0);
    }
    const end = endDate.getTime();

    const rows=d.hourly.time.map((t,i)=>({
      t:new Date(t).getTime(),
      p:d.hourly.precipitation_probability[i] ?? 0,
      mm:d.hourly.precipitation[i] ?? 0,
      code:d.hourly.weather_code[i] ?? 0
    })).filter(x=>x.t>=now-30*60e3 && x.t<=end);
    if(!rows.length) throw new Error();

    const maxP=Math.max(...rows.map(x=>x.p));
    const total=rows.reduce((s,x)=>s+x.mm,0);
    const rainy=rows.some(x=>x.mm>=0.1 || [51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].includes(x.code));

    spin.hidden=true;
    if(total>=0.5 || maxP>=50 || rainy){
      icon.textContent="☔"; answer.textContent="傘、持っていこう"; answer.className="yes";
      sub.textContent="判定対象時間内に雨の可能性があります。";
    }else if(maxP>=30 || total>0){
      icon.textContent="🌂"; answer.textContent="折りたたみ推奨"; answer.className="maybe";
      sub.textContent="強い雨の見込みは低めですが、念のためあると安心です。";
    }else{
      icon.textContent="☀️"; answer.textContent="傘はいらなそう"; answer.className="no";
      sub.textContent="判定対象時間内は雨の可能性が低めです。";
    }
    const fmt = dt => `${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,"0")}:${String(dt.getMinutes()).padStart(2,"0")}`;
    details.textContent=`判定範囲：現在〜${fmt(endDate)} ・ 最大降水確率 ${Math.round(maxP)}% ・ 予想降水量 ${total.toFixed(1)} mm ・ 位置精度 約${Math.round(accuracy)}m`;
    retry.hidden=false; retry.textContent="更新";
  }catch(e){ fail("天気データを取得できませんでした。通信状態を確認してください。"); }
}
function start(){
  retry.hidden=true; spin.hidden=false; answer.textContent="判定中"; answer.className="";
  icon.textContent="📍"; locationEl.textContent="📍 現在地を取得中…"; sub.textContent="現在地を取得して、雨を確認しています。"; details.textContent="";
  if(!navigator.geolocation) return fail("このブラウザは位置情報取得に対応していません。");
  navigator.geolocation.getCurrentPosition(
    p=>judge(p.coords.latitude,p.coords.longitude,p.coords.accuracy),
    e=>fail(e.code===1 ? "位置情報の利用を許可してください。" : "現在地を取得できませんでした。"),
    {enableHighAccuracy:true,timeout:10000,maximumAge:60000}
  );
}
retry.onclick=start;
start();
</script>
</body>
</html>
