<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101727"><title>ありえない車窓 AI動画リンク集100</title><style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151d32;--muted:#aebbd2;--ink:#edf4ff;--line:#2b3954;--accent:#8fe7e0}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:radial-gradient(circle at 20% 0%,#24365b 0,transparent 35%),var(--bg);color:var(--ink)}a{color:inherit;text-decoration:none}.wrap{max-width:1120px;margin:auto;padding:22px}header{padding:45px 0 20px}.eyebrow{color:var(--accent);font-size:.8rem;font-weight:800;letter-spacing:.16em}h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.2;margin:12px 0}header p{color:var(--muted);max-width:850px;line-height:1.85}.note{background:#213148;border:1px solid #47637c;border-radius:12px;padding:14px 18px;line-height:1.7;font-size:.93rem}.tools{position:sticky;top:0;z-index:5;background:#0b1020ef;backdrop-filter:blur(12px);padding:13px 0;border-bottom:1px solid var(--line)}.controls{display:flex;gap:10px;flex-wrap:wrap}input,select,button{font:inherit;border-radius:9px;border:1px solid #44536e;background:#1a2640;color:var(--ink);padding:11px 13px}input{flex:1;min-width:180px}button{cursor:pointer}button:hover,.link:hover{border-color:var(--accent)}button.active{background:#275d61;border-color:var(--accent)}.stats{color:var(--muted);font-size:.86rem;margin-top:11px}section{margin:30px 0 40px}h2{font-size:1.3rem;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}.item{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;gap:8px;align-items:stretch;padding:8px}.link{padding:10px;flex:1;min-width:0;border-radius:8px;border:1px solid transparent}.num{color:var(--accent);font-size:.8rem;font-weight:bold}.term{font-weight:650;overflow-wrap:anywhere;margin-top:7px}.label{font-size:.78rem;color:var(--muted);margin-top:8px}.star{height:40px;align-self:center;font-size:1.25rem;padding:6px 10px;min-width:43px}.star.on{color:#ffcb69;border-color:#ffcb69}.empty{padding:35px;text-align:center;color:var(--muted)}footer{color:var(--muted);padding:40px 0;border-top:1px solid var(--line);font-size:.85rem;line-height:1.8}mark{background:#427976;color:white;border-radius:3px}@media(max-width:550px){.wrap{padding:15px}.tools{top:0}.grid{grid-template-columns:1fr}header{padding-top:28px}}
</style></head><body><div class="wrap"><header><div class="eyebrow">AI × TRAIN WINDOW × SURREALISM</div><h1>ありえない車窓<br>AI動画リンク集 <span style="color:var(--accent)">100</span></h1><p>電車の窓の外に広がる異世界、宇宙、海底、巨大生物、常識外れの線路。YouTubeの関連映像を探し回るための、10ジャンル・100キーワードの探索ガイド。</p><div class="note"><b>リンクについて：</b>100件は個別動画への直リンクではなく、YouTube検索結果へのリンクです。実在未確認の動画URLを掲載しないための設計です。公開動画や検索結果は随時変わります。</div></header></div><div class="tools"><div class="wrap" style="padding-top:0;padding-bottom:0"><div class="controls"><input id="search" type="search" placeholder="キーワードで100件を検索（例：宇宙 / train / horror）" aria-label="リンクを検索"><select id="category" aria-label="ジャンル"><option value="">すべてのジャンル</option></select><button id="favorites" aria-pressed="false">☆ お気に入りのみ</button><button id="reset">リセット</button></div><div class="stats" id="stats" aria-live="polite"></div></div></div><main class="wrap" id="main"></main><footer class="wrap">車窓の向こうは、現実である必要がない。<br>検索リンク先：YouTube ／ お気に入り情報はこのブラウザ内に保存されます。</footer><script>
const groups=[
['異世界・夢のような車窓',['dreamcore train ride AI','surreal train window AI','AI fantasy train journey','impossible train window view','dreamcore train window','liminal space train ride','AI generated train scenery','surreal railway journey AI','dreamlike train POV','AI magical train ride']],
['物理法則を無視する鉄道',['impossible railway AI video','gravity defying train AI','train flying through sky AI','train through clouds AI','roller coaster railway AI','vertical railway AI generated','train on impossible bridge AI','train upside down AI','surreal train tracks AI','impossible train journey shorts']],
['宇宙・惑星・天体',['train in space AI video','cosmic railway AI','train through galaxy AI','train window outer space','train on the moon AI','train through Saturn rings AI','train across planets AI','space train dreamcore','celestial train journey AI','surreal cosmic train POV']],
['海底・水中世界',['underwater train AI video','train through ocean AI','submarine railway dreamcore','train window underwater world','train among giant fish AI','train through aquarium AI','ocean floor railway AI','train in deep sea AI','underwater surreal train ride','train through coral reef AI']],
['巨大生物・怪物が見える車窓',['giant creature train window AI','train passing giant monsters AI','kaiju train POV AI','giant whale flying train AI','train window dinosaurs AI','train passing giant animals AI','fantasy creatures train journey','surreal monster railway AI','train through dragon world AI','giant jellyfish train window AI']],
['巨大都市・建造物・廃墟',['megacity train ride AI','surreal architecture train window','brutalist railway dreamcore','train through futuristic city AI','giant buildings train POV AI','liminal city train journey','abandoned city railway AI','train through endless tunnels AI','cyberpunk railway window AI','impossible architecture train ride']],
['自然・幻想世界',['fantasy forest train AI','train through giant flowers AI','train through surreal desert AI','train across floating islands AI','train through aurora sky AI','train through crystal cave AI','train through glowing forest AI','train across clouds dreamcore','magical landscape train POV','AI enchanted railway journey']],
['恐怖・不気味・バックルーム',['horror train window AI','backrooms train ride AI','nightmare train journey AI','creepy train POV AI','liminal railway horror','train into the void AI','uncanny train window AI','analog horror train ride AI','endless empty train dreamcore','surreal horror railway shorts']],
['日本風・アニメ風・奇妙な車窓',['AI 電車 車窓 異世界','AI生成 電車 不思議な風景','AI 鉄道 シュール 動画','異世界列車 AI ショート','AI 電車 窓の外 おかしい','日本の電車 ドリームコア AI','anime fantasy train ride AI','Studio Ghibli style train AI','Japanese surreal train window','AI train ride anime scenery']],
['ショート動画・最新トレンド',['dreamcore train ride shorts','AI surreal train shorts','impossible train AI shorts','AI train window trend','dreamcore railway 2026','surreal train ride 2026','AI generated train POV shorts','fantasy train window shorts','viral AI train ride','Plot Party dreamcore train ride']]];
const items=groups.flatMap(([cat,terms],gi)=>terms.map((term,i)=>({cat,term,num:gi*10+i+1})));
let saved=[];try{saved=JSON.parse(localStorage.getItem('train-ai-favorites')||'[]')}catch{}const fav=new Set(Array.isArray(saved)?saved:[]);const $=s=>document.querySelector(s);const category=$('#category');groups.forEach(g=>{let o=document.createElement('option');o.value=o.textContent=g[0];category.append(o)});let onlyFav=false;
function render(){const query=$('#search').value.toLocaleLowerCase().trim(),cat=category.value;const matched=items.filter(x=>(!cat||x.cat===cat)&&(!onlyFav||fav.has(x.num))&&(!query||(x.term+' '+x.cat+' '+x.num).toLocaleLowerCase().includes(query)));const main=$('#main');main.replaceChildren();for(const [name] of groups){const entries=matched.filter(x=>x.cat===name);if(!entries.length)continue;const sec=document.createElement('section');const h=document.createElement('h2');h.textContent=name+' · '+entries.length+'件';sec.append(h);const grid=document.createElement('div');grid.className='grid';for(const x of entries){const card=document.createElement('article');card.className='item';const link=document.createElement('a');link.className='link';link.href='https://www.youtube.com/results?search_query='+encodeURIComponent(x.term);link.target='_blank';link.rel='noopener noreferrer';link.setAttribute('aria-label',x.term+' のYouTube検索結果を開く');const num=document.createElement('div');num.className='num';num.textContent='#'+String(x.num).padStart(3,'0');const term=document.createElement('div');term.className='term';term.textContent=x.term;const label=document.createElement('div');label.className='label';label.textContent='YouTubeで検索 ↗';link.append(num,term,label);const star=document.createElement('button');star.className='star'+(fav.has(x.num)?' on':'');star.textContent=fav.has(x.num)?'★':'☆';star.setAttribute('aria-label',x.term+'をお気に入り'+(fav.has(x.num)?'から削除':'に追加'));star.setAttribute('aria-pressed',String(fav.has(x.num)));star.addEventListener('click',()=>{fav.has(x.num)?fav.delete(x.num):fav.add(x.num);try{localStorage.setItem('train-ai-favorites',JSON.stringify([...fav]))}catch{}render()});card.append(link,star);grid.append(card)}sec.append(grid);main.append(sec)}if(!matched.length){let e=document.createElement('div');e.className='empty';e.textContent='該当するリンクはありません。条件を変更してください。';main.append(e)}$('#stats').textContent=`${matched.length} / 100 件を表示中 ｜ お気に入り ${fav.size} 件`}
$('#search').addEventListener('input',render);category.addEventListener('change',render);$('#favorites').addEventListener('click',e=>{onlyFav=!onlyFav;e.currentTarget.classList.toggle('active',onlyFav);e.currentTarget.setAttribute('aria-pressed',String(onlyFav));render()});$('#reset').addEventListener('click',()=>{$('#search').value='';category.value='';onlyFav=false;$('#favorites').classList.remove('active');$('#favorites').setAttribute('aria-pressed','false');render()});render();
</script></body></html>
