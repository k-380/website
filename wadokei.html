<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>不定時法時計</title>
<style>
:root{--bg1:#0b1020;--panel:rgba(255,255,255,.08);--border:rgba(255,255,255,.12);--text:#f5f7ff;--sub:#bfc7e6;--accent:#ffd36e;--ring:rgba(255,255,255,.12);--progress:0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;background:radial-gradient(circle at top,#243057 0%,#151a31 35%,#0b1020 100%);display:flex;align-items:center;justify-content:center;padding:24px}
.app{width:min(1000px,100%);background:rgba(10,14,28,.72);border:1px solid var(--border);border-radius:28px;backdrop-filter:blur(10px);box-shadow:0 18px 40px rgba(0,0,0,.35);padding:24px}
.header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:20px}
.title{font-size:clamp(1.6rem,2.8vw,2.4rem);font-weight:800;letter-spacing:.03em;margin:0}
.subtitle{margin:6px 0 0;color:var(--sub);font-size:.98rem}
.location{text-align:right;color:var(--sub);font-size:.95rem;line-height:1.5}
.main{display:grid;grid-template-columns:1.25fr .95fr;gap:22px;align-items:center}
.clock-panel,.info-panel{background:var(--panel);border:1px solid var(--border);border-radius:24px;padding:20px}
.clock-wrap{display:flex;justify-content:center;align-items:center;min-height:520px}
.donut{width:min(72vw,460px);aspect-ratio:1;border-radius:50%;position:relative;display:grid;place-items:center;background:conic-gradient(var(--accent) 0 calc(var(--progress)*1%),var(--ring) calc(var(--progress)*1%) 100%);box-shadow:inset 0 0 24px rgba(0,0,0,.25),0 16px 40px rgba(0,0,0,.32)}
.donut:before{content:"";position:absolute;inset:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#162244 0%,#0d1429 62%,#09101d 100%);box-shadow:inset 0 0 24px rgba(255,255,255,.05),inset 0 0 40px rgba(0,0,0,.28)}
.donut:after{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.16) 0deg .36deg,transparent .36deg 3.6deg);-webkit-mask:radial-gradient(circle,transparent 0 67%,black 68% 100%);mask:radial-gradient(circle,transparent 0 67%,black 68% 100%);opacity:.35;pointer-events:none}
.center{position:relative;z-index:1;width:68%;text-align:center;padding:18px}
.center-label{color:var(--sub);font-size:.98rem;margin-bottom:10px;letter-spacing:.08em}
.koku-name{font-size:clamp(2.2rem,5vw,4rem);font-weight:800;letter-spacing:.04em;margin:0 0 10px;text-shadow:0 0 24px rgba(255,211,110,.18)}
.progress-text{font-size:clamp(1.25rem,3.5vw,2.1rem);font-weight:700;color:var(--accent);margin:0 0 10px}
.range-text,.remain-text{color:var(--sub);font-size:.95rem;line-height:1.6;margin:0}
.info-grid{display:grid;grid-template-columns:1fr;gap:14px}
.info-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:14px 16px}
.info-label{color:var(--sub);font-size:.9rem;margin-bottom:6px}
.info-value{font-size:1.15rem;font-weight:700;line-height:1.4}
.note{margin-top:18px;color:var(--sub);font-size:.9rem;line-height:1.7}
.buttons{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
button{appearance:none;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:var(--text);border-radius:999px;padding:10px 14px;font-size:.95rem;cursor:pointer}
button:hover{background:rgba(255,255,255,.14)}
@media(max-width:860px){.main{grid-template-columns:1fr}.clock-wrap{min-height:auto;padding:8px 0}.donut{width:min(86vw,420px)}.location{text-align:left}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div><h1 class="title">不定時法時計</h1><p class="subtitle">日の出から日没までを6等分、日没から翌日の出までを6等分して現在の刻を表示します。</p></div>
    <div class="location"><div id="locationText">位置情報を取得中...</div><div id="statusText">初期化中...</div></div>
  </div>
  <div class="main">
    <section class="clock-panel"><div class="clock-wrap"><div class="donut"><div class="center">
      <div class="center-label">現在の刻</div><h2 class="koku-name" id="kokuName">--の刻</h2>
      <p class="progress-text" id="progressText">--.-%</p><p class="range-text" id="rangeText">--:--:-- ～ --:--:--</p><p class="remain-text" id="remainText">残り --</p>
    </div></div></div></section>
    <section class="info-panel">
      <div class="info-grid">
        <div class="info-card"><div class="info-label">現在の日付</div><div class="info-value" id="dateText">--</div></div>
        <div class="info-card"><div class="info-label">日の出</div><div class="info-value" id="sunriseText">--:--:--</div></div>
        <div class="info-card"><div class="info-label">日の入り</div><div class="info-value" id="sunsetText">--:--:--</div></div>
        <div class="info-card"><div class="info-label">昼の一刻の長さ</div><div class="info-value" id="dayKokuText">--</div></div>
        <div class="info-card"><div class="info-label">夜の一刻の長さ</div><div class="info-value" id="nightKokuText">--</div></div>
      </div>
      <div class="buttons"><button id="geoButton">現在地を使う</button><button id="refreshButton">再計算</button></div>
      <div class="note">※ 位置情報が取得できない場合は滋賀県草津市付近で計算します。<br>※ 昼は「卯・辰・巳・午・未・申」、夜は「酉・戌・亥・子・丑・寅」として扱います。</div>
    </section>
  </div>
</div>
<script>
const FALLBACK={lat:35.017,lng:135.959,label:"滋賀県草津市（既定値）"};
let loc={...FALLBACK};
const DAY=["卯の刻","辰の刻","巳の刻","午の刻","未の刻","申の刻"], NIGHT=["酉の刻","戌の刻","亥の刻","子の刻","丑の刻","寅の刻"], WD=["日","月","火","水","木","金","土"];
const pad=n=>String(n).padStart(2,"0");
const fmtDate=d=>`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`;
const fmtTime=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
function fmtDur(ms){const t=Math.max(0,Math.round(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return `${h}時間${m}分${s}秒`}
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const r=x=>x*Math.PI/180, deg=x=>x*180/Math.PI, norm=x=>(x%360+360)%360;
function doy(d){return Math.floor((d-new Date(d.getFullYear(),0,0))/86400000)}
function sunEvent(date,lat,lng,rise){
  const N=doy(date),lh=lng/15,t=N+((rise?6:18)-lh)/24,M=.9856*t-3.289;
  let L=norm(M+1.916*Math.sin(r(M))+.020*Math.sin(r(2*M))+282.634);
  let RA=norm(deg(Math.atan(.91764*Math.tan(r(L))))); RA+=Math.floor(L/90)*90-Math.floor(RA/90)*90; RA/=15;
  const sd=.39782*Math.sin(r(L)),cd=Math.cos(Math.asin(sd)),ch=(Math.cos(r(90.833))-sd*Math.sin(r(lat)))/(cd*Math.cos(r(lat)));
  if(ch>1||ch<-1)return null;
  let H=(rise?360-deg(Math.acos(ch)):deg(Math.acos(ch)))/15;
  let UT=H+RA-.06571*t-6.622-lh; while(UT<0)UT+=24; while(UT>=24)UT-=24;
  const tz=-date.getTimezoneOffset()/60,base=new Date(date.getFullYear(),date.getMonth(),date.getDate());
  return new Date(base.getTime()+(UT+tz)*3600000);
}
const sunTimes=(d,lat,lng)=>({sunrise:sunEvent(d,lat,lng,true),sunset:sunEvent(d,lat,lng,false)});
function temporal(now,lat,lng){
  const today=sod(now),y=addDays(today,-1),tom=addDays(today,1),a=sunTimes(today,lat,lng),b=sunTimes(y,lat,lng),c=sunTimes(tom,lat,lng);
  if(!a.sunrise||!a.sunset||!b.sunset||!c.sunrise)return null;
  const dayLen=(a.sunset-a.sunrise)/6,nightLen=(c.sunrise-a.sunset)/6;
  let ps,pe,len,names,idx;
  if(now>=a.sunrise&&now<a.sunset){ps=a.sunrise;pe=a.sunset;names=DAY}
  else if(now>=a.sunset){ps=a.sunset;pe=c.sunrise;names=NIGHT}
  else{ps=b.sunset;pe=a.sunrise;names=NIGHT}
  len=(pe-ps)/6; idx=Math.max(0,Math.min(5,Math.floor((now-ps)/len)));
  const ss=new Date(ps.getTime()+idx*len),se=new Date(ss.getTime()+len),progress=(now-ss)/len*100;
  return{sunrise:a.sunrise,sunset:a.sunset,dayLen,nightLen,name:names[idx],progress,ss,se,remain:se-now}
}
function update(){
  const now=new Date(),d=temporal(now,loc.lat,loc.lng); dateText.textContent=fmtDate(now);
  if(!d){statusText.textContent="日の出・日の入りを計算できませんでした。";return}
  document.documentElement.style.setProperty("--progress",d.progress.toFixed(1));
  kokuName.textContent=d.name;progressText.textContent=d.progress.toFixed(1)+"%";rangeText.textContent=fmtTime(d.ss)+" ～ "+fmtTime(d.se);remainText.textContent="残り "+fmtDur(d.remain);
  sunriseText.textContent=fmtTime(d.sunrise);sunsetText.textContent=fmtTime(d.sunset);dayKokuText.textContent=fmtDur(d.dayLen);nightKokuText.textContent=fmtDur(d.nightLen);statusText.textContent="更新時刻: "+fmtTime(now);
}
function setLoc(lat,lng,label){loc={lat,lng,label};locationText.textContent=`位置: ${label} / 緯度 ${lat.toFixed(4)}・経度 ${lng.toFixed(4)}`;update()}
function geo(){
  if(!navigator.geolocation){setLoc(FALLBACK.lat,FALLBACK.lng,FALLBACK.label);return}
  statusText.textContent="位置情報を取得しています...";
  navigator.geolocation.getCurrentPosition(p=>{setLoc(p.coords.latitude,p.coords.longitude,"現在地");statusText.textContent="現在地を使用中"},()=>{setLoc(FALLBACK.lat,FALLBACK.lng,FALLBACK.label);statusText.textContent="位置情報を取得できないため既定値を使用中"},{enableHighAccuracy:true,timeout:8000,maximumAge:300000});
}
geoButton.addEventListener("click",geo);refreshButton.addEventListener("click",update);
setLoc(FALLBACK.lat,FALLBACK.lng,FALLBACK.label);geo();setInterval(update,1000);
</script>
</body>
</html>
